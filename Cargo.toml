[package]
name = "trim-mp3-cover-art"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "=4.5.31", features = ["derive"] }
clap_lex = "=0.7.4"
id3 = "1.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
winresource = "0.1"